<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Portal do Professor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card" style="max-width: 380px; margin-top: 60px;">
    <h2 style="text-align: center; margin-bottom: 15px;">Acesso ao Portal</h2>
    <form action="dashboard.html" method="GET">
      <label>E-mail:</label>
      <input type="email" placeholder="digite seu e-mail" required>
      <label>Senha:</label>
      <input type="password" placeholder="digite sua senha" required>
      <button type="submit">Entrar no Sistema</button>
    </form>
  </div>
</body>
</html>
